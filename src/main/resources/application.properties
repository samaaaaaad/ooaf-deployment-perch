spring.application.name=event-ticketing

# Local MVP database. Hibernate evolves the schema while the model is changing.
spring.datasource.url=jdbc:h2:file:./data/event-ticketing;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Development-only database browser: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# US 7: how long a selected seat stays reserved for a customer (ISO-8601 duration, e.g. PT5M = 5 minutes).
seat-hold.duration=PT5M
seat-hold.release-interval=PT10S

# US 8 / 8.1: payment provider. "mock" creates a fake PaymentIntent and confirms in-process.
# Switch to "stripe" and set keys in application-local.properties (gitignored).
payment.provider=mock
# Empty defaults so the app always boots without application-local.properties (e.g. a teammate who
# has not created one). Real values come from application-local.properties (dev) or env vars, which
# both override these. Under payment.provider=mock the Stripe beans are inactive and ignore them.
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# Optional local overrides (Stripe keys, etc.) — file is gitignored.
spring.config.import=optional:classpath:application-local.properties

# US 10: e-ticket delivery email (codes + QR). Prefer setting spring.mail.* in
# application-local.properties (gitignored), e.g. Mailtrap. With mail unset,
# bookings still succeed; ticket codes are logged and the SMTP send is skipped.
# See docs/user-story-10-eticket-delivery.md.
perch.mail.from=no-reply@perch.local
#spring.mail.host=sandbox.smtp.mailtrap.io
#spring.mail.port=2525
#spring.mail.username=YOUR_MAILTRAP_USERNAME
#spring.mail.password=YOUR_MAILTRAP_PASSWORD
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true

# Seed the demo organiser's published events (DemoEventSeeder). Idempotent; set false for an empty catalogue.
perch.seed.demo-events=true
