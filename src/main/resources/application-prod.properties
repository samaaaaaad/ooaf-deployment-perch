# Production profile. Activate with SPRING_PROFILES_ACTIVE=prod.
# All values come from environment variables so no secret is ever committed.
# See docs/deployment.md for the full list and hosting steps.

# --- Database: managed PostgreSQL ---
# The container/host supplies these. Startup fails fast if the URL is missing, which is intended.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate manages the schema on the fresh production database. Because prod starts empty there is
# no legacy constraint to widen, so 'update' creates a correct schema straight from the entities.
# Hardening follow-up (see docs/deployment.md): switch to Flyway migrations and ddl-auto=validate.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- The H2 web console must never be exposed in production ---
spring.h2.console.enabled=false

# --- Seat holds (same defaults as dev; override via env if needed) ---
seat-hold.duration=${SEAT_HOLD_DURATION:PT5M}
seat-hold.release-interval=${SEAT_HOLD_RELEASE_INTERVAL:PT10S}

# --- Payments ---
# Defaults to the in-process mock so the app boots without keys. Set PAYMENT_PROVIDER=stripe and the
# STRIPE_* vars to take real (test-mode) payments.
payment.provider=${PAYMENT_PROVIDER:mock}
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# --- Booking confirmation email (optional) ---
# Mail auto-configures only when SPRING_MAIL_HOST is set in the environment (Spring binds
# SPRING_MAIL_HOST/PORT/USERNAME/PASSWORD automatically). Left unset, no mail sender is created and
# the email step is skipped. We deliberately do NOT give the host an empty default, because an empty
# host still activates mail autoconfig and then fails its health check.
perch.mail.from=${PERCH_MAIL_FROM:no-reply@perch.local}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Email is best-effort: a mail outage must never mark the whole service DOWN (which could make a
# host kill the container).
management.health.mail.enabled=false

# --- Health endpoint for the host's health check ---
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# --- Demo catalogue (DemoEventSeeder). Set PERCH_SEED_DEMO_EVENTS=false for a production launch. ---
perch.seed.demo-events=${PERCH_SEED_DEMO_EVENTS:true}
