plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'com.google.zxing:core:3.5.3'
	implementation 'com.google.zxing:javase:3.5.3'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	// US: live seat map over WebSocket/STOMP (push seat-status changes instead of polling).
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.springframework.boot:spring-boot-h2console'
	// Production database driver. Active only under the 'prod' profile (see application-prod.properties).
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	implementation 'org.springframework.security:spring-security-crypto'
	// Email confirmations (JavaMailSender). Only active once spring.mail.* is set.
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	// Stripe payments. Only used when payment.provider=stripe.
	implementation 'com.stripe:stripe-java:33.4.2'
}

tasks.named('test') {
	useJUnitPlatform()
}

jacoco {
	toolVersion = '0.8.13'
}

// Every test run also writes the coverage report:
// build/reports/jacoco/test/html/index.html (and jacocoTestReport.xml for tooling).
tasks.named('test') {
	finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	reports {
		xml.required = true
		html.required = true
	}
}

// 'gradlew check' (and so 'build') fails if service or controller line coverage drops below 85%.
tasks.named('jacocoTestCoverageVerification') {
	violationRules {
		rule {
			element = 'PACKAGE'
			includes = ['com.example.event_ticketing.service', 'com.example.event_ticketing.controller']
			limit {
				counter = 'LINE'
				minimum = 0.85
			}
		}
	}
}

tasks.named('check') {
	dependsOn tasks.named('jacocoTestCoverageVerification')
}
